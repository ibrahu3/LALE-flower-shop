    <div class="bouquet-container">

        <div class="price-box">

        </div>

        <div class="bouquet-area" id="bouquetArea">
            <img src="images/bouquet.png" class="bouquet-image">
        </div>

    </div>

    <div class="sidebar">
        <h2>Flowers</h2>

        <img src="images/flower1.png"
             class="flower"
             draggable="true"
             ondragstart="drag(event)"
             id="flower1">

        <img src="images/flower2.png"
             class="flower"
             draggable="true"
             ondragstart="drag(event)"
             id="flower2">
    </div>

</div>
